        <div id="introStep" class="hidden flex h-full min-h-0 flex-col justify-between gap-3">
          <!-- Auth Section -->
          <div id="authSection" class="overflow-hidden">
            <div class="auth-shell">
              <!-- Header con logo -->
              <div class="auth-header">
                <svg class="auth-logo-icon" viewBox="0 0 24 24" fill="none">
                  <path d="M12 2L2 20h20L12 2z" fill="#3b82f6"/>
                  <path d="M12 8l-5 10h10L12 8z" fill="#60a5fa"/>
                </svg>
                <span class="auth-logo-text">TRCVASTIAN</span>
              </div>

              <!-- Hero: título + ilustración -->
              <div class="auth-hero">
                <div class="auth-hero-copy">
                  <h2 class="auth-hero-title">Inicia sesión o <span class="auth-hero-title-accent">regístrate</span></h2>
                  <p class="auth-hero-text">Accede para subir, analizar y mejorar tu CV con IA.</p>
                </div>
                <div class="auth-hero-art" aria-hidden="true">
                  <!-- Ilustración de documento con flecha de subida -->
                  <div class="auth-art-document">
                    <div class="auth-art-doc-lines">
                      <div class="auth-art-doc-line w-3/4"></div>
                      <div class="auth-art-doc-line w-1/2"></div>
                      <div class="auth-art-doc-line w-2/3"></div>
                    </div>
                    <div class="auth-art-upload-btn">
                      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19V5"/>
                        <path d="m5 12 7-7 7 7"/>
                      </svg>
                    </div>
                  </div>
                  <div class="auth-art-sparkle auth-art-sparkle-1"></div>
                  <div class="auth-art-sparkle auth-art-sparkle-2"></div>
                  <div class="auth-art-sparkle auth-art-sparkle-3"></div>
                </div>
              </div>

              <!-- Divider con label -->
              <div class="auth-divider-section">
                <span class="auth-divider-line"></span>
                <span class="auth-divider-label">INICIAR SESIÓN</span>
                <span class="auth-divider-line"></span>
              </div>

              <!-- Login Form -->
              <div id="loginForm" class="auth-panel">
                <label class="auth-field">
                  <span class="auth-field-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="2" y="4" width="20" height="16" rx="2"/>
                      <path d="m22 4-10 8L2 4"/>
                    </svg>
                  </span>
                  <input id="loginEmail" type="email" placeholder="Email" class="auth-input" />
                </label>
                <label class="auth-field">
                  <span class="auth-field-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="11" width="18" height="11" rx="2"/>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                  </span>
                  <input id="loginPassword" type="password" placeholder="Contraseña" class="auth-input auth-input-password" />
                  <button type="button" id="loginPasswordToggle" class="auth-field-action" aria-label="Mostrar contraseña">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                  </button>
                </label>
                <div class="auth-row">
                  <label class="auth-check">
                    <input id="rememberMe" type="checkbox" />
                    <span>Recordarme</span>
                  </label>
                  <button type="button" id="forgotPasswordBtn" class="auth-link">¿Olvidaste tu contraseña?</button>
                </div>
                <button type="button" id="loginBtn" class="auth-submit-btn">
                  <span>Entrar</span>
                  <svg class="auth-btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/>
                    <path d="m12 5 7 7-7 7"/>
                  </svg>
                </button>
                <p class="auth-inline-switch">¿No tienes cuenta? <button type="button" id="showRegisterBtn" class="auth-inline-link">Regístrate</button></p>
              </div>

              <!-- Register Form -->
              <div id="registerForm" class="auth-panel hidden">
                <div class="auth-divider-section">
                  <span class="auth-divider-line"></span>
                  <span class="auth-divider-label">CREAR CUENTA</span>
                  <span class="auth-divider-line"></span>
                </div>
                <label class="auth-field">
                  <span class="auth-field-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                      <circle cx="12" cy="7" r="4"/>
                    </svg>
                  </span>
                  <input id="registerName" type="text" placeholder="Nombre completo" class="auth-input" />
                </label>
                <label class="auth-field">
                  <span class="auth-field-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="2" y="4" width="20" height="16" rx="2"/>
                      <path d="m22 4-10 8L2 4"/>
                    </svg>
                  </span>
                  <input id="registerEmail" type="email" placeholder="Email" class="auth-input" />
                </label>
                <label class="auth-field">
                  <span class="auth-field-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="11" width="18" height="11" rx="2"/>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                  </span>
                  <input id="registerPassword" type="password" placeholder="Contraseña" class="auth-input auth-input-password" />
                  <button type="button" id="registerPasswordToggle" class="auth-field-action" aria-label="Mostrar contraseña">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                  </button>
                </label>
                <button type="button" id="registerBtn" class="auth-submit-btn">
                  <span>Crear cuenta</span>
                  <svg class="auth-btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/>
                    <path d="m12 5 7 7-7 7"/>
                  </svg>
                </button>
                <p class="auth-inline-switch">¿Ya tienes cuenta? <button type="button" id="showLoginBtn" class="auth-inline-link">Inicia sesión</button></p>
              </div>

              <!-- User logged in (hidden by default) -->
              <div id="userPanel" class="mt-4 hidden">
                <div class="paper-card p-3 text-center">
                  <div class="w-12 h-12 rounded-full bg-[#0f5d86] text-white flex items-center justify-center mx-auto text-lg font-bold" id="userInitial">U</div>
                  <p id="userName" class="title-display mt-2 text-[15px] font-semibold text-[#071e27]">Usuario</p>
                  <p id="userEmail" class="text-xs text-[#4d6570]">email@example.com</p>
                  <button type="button" id="logoutBtn" class="btn-secondary w-full mt-3 py-2 text-[14px]">Cerrar sesión</button>
                </div>
              </div>
              <p id="authError" class="auth-error hidden"></p>
            </div>
          </div>
